name: Update keiba data
on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect JRA data
        run: python scripts/update_races.py
      - name: Show result
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/races.json",encoding="utf-8"))
          print("updated_at:",p["updated_at"])
          print("races:",len(p["races"]))
          for r in p["races"][:10]:
              print(r["venue"],r["race_no"],len(r["horses"]),r["distance"])
          PY
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json
          git diff --cached --quiet || git commit -m "Update JRA race data"
          git pull --rebase origin main
          git push
