name: Update keiba data

on:
  schedule:
    - cron: "30 1 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch JRA race data
        run: python scripts/update_races.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json
          git diff --cached --quiet || git commit -m "Update JRA race data"
          git pull --rebase origin main
          git push
